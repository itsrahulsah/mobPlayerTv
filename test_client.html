<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobPlayer TV Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #6366f1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            margin-top: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }
        
        .status-connected::before {
            box-shadow: 0 0 8px var(--success);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }
        
        .input-row > div {
            flex: 1;
        }

        .input-action {
            display: flex;
            gap: 8px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        button:active {
            transform: scale(0.97);
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        button.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Remote Control Layout */
        .remote-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
        }

        .dpad {
            position: relative;
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        .dpad-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            padding: 15px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }

        .dpad-btn:hover {
            color: var(--primary);
            background: rgba(255,255,255,0.05);
        }

        .dpad-btn:active {
            transform: scale(0.9);
        }

        .dpad-up { top: 5px; }
        .dpad-down { bottom: 5px; }
        .dpad-left { left: 5px; }
        .dpad-right { right: 5px; }

        .dpad-center {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid var(--border-color);
            font-weight: 700;
            color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .dpad-center:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .action-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        .action-btn i {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .media-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .media-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 0;
            border: none;
        }

        .media-btn.play {
            background: var(--text-main);
            color: var(--bg-color);
            width: 56px;
            height: 56px;
        }

        .media-btn.play:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }
        
        .media-btn.play:active {
            transform: scale(0.95);
        }

        /* Log Box */
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .log-box {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
        }

        .log-item {
            margin-bottom: 6px;
            line-height: 1.5;
            word-break: break-all;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        
        .log-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 8px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-tv" style="margin-right: 8px;"></i>MobPlayer TV</h1>
            <p>Interactive Remote Controller</p>
            <div id="status" class="status-badge">Disconnected</div>
        </header>

        <div class="grid">
            <!-- Connection & Settings -->
            <div class="card-column" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card" id="connectionCard">
                    <div class="card-title"><i class="fa-solid fa-wifi"></i> Connection</div>
                    
                    <div class="input-row form-group">
                        <div>
                            <label for="ipInput">Server IP Address</label>
                            <input type="text" id="ipInput" value="localhost" placeholder="e.g. 192.168.1.10" />
                        </div>
                        <div style="flex: 0.5;">
                            <label for="portInput">Port</label>
                            <input type="number" id="portInput" value="8080" placeholder="8080" />
                        </div>
                    </div>

                    <div class="input-row form-group">
                        <button class="primary" onclick="connect()" style="flex: 1;"><i class="fa-solid fa-link"></i> Connect</button>
                        <button class="danger" onclick="disconnect()"><i class="fa-solid fa-unlink"></i></button>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <div class="form-group">
                        <label for="pinInput">Pairing PIN</label>
                        <div class="input-action">
                            <input type="text" id="pinInput" placeholder="Enter 4-digit PIN" maxlength="4" style="text-align: center; letter-spacing: 4px; font-weight: bold;" />
                            <button class="primary" onclick="sendPinSubmit()"><i class="fa-solid fa-check"></i></button>
                        </div>
                    </div>
                    
                    <button onclick="sendAuthRequest()" style="width: 100%;"><i class="fa-solid fa-key"></i> Auto Auth (Saved Token)</button>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-chromecast"></i> Cast Media</div>
                    <div class="form-group">
                        <label for="mediaUrl">Direct Video Stream URL</label>
                        <div class="input-action">
                            <input type="text" id="mediaUrl" placeholder="MP4 / HLS URL" value="https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" />
                            <button class="primary" onclick="sendLoadMedia()"><i class="fa-solid fa-play"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Remote Controller -->
            <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
                <div class="card-title" style="align-self: flex-start; margin-bottom: 24px;"><i class="fa-solid fa-gamepad"></i> Controller</div>
                
                <div class="remote-container">
                    <div class="action-row">
                        <button class="action-btn" onclick="sendAction('BACK')"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button class="action-btn" onclick="sendAction('HOME')"><i class="fa-solid fa-house"></i> Home</button>
                    </div>

                    <div class="dpad">
                        <button class="dpad-btn dpad-up" onclick="sendAction('DPAD_UP')"><i class="fa-solid fa-caret-up"></i></button>
                        <button class="dpad-btn dpad-left" onclick="sendAction('DPAD_LEFT')"><i class="fa-solid fa-caret-left"></i></button>
                        <button class="dpad-center" onclick="sendAction('DPAD_CENTER')">OK</button>
                        <button class="dpad-btn dpad-right" onclick="sendAction('DPAD_RIGHT')"><i class="fa-solid fa-caret-right"></i></button>
                        <button class="dpad-btn dpad-down" onclick="sendAction('DPAD_DOWN')"><i class="fa-solid fa-caret-down"></i></button>
                    </div>

                    <div class="media-controls">
                        <button class="media-btn" onclick="sendAction('SEEK_BACKWARD')"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="media-btn play" onclick="sendAction('PLAY')"><i class="fa-solid fa-play"></i></button>
                        <button class="media-btn" onclick="sendAction('PAUSE')"><i class="fa-solid fa-pause"></i></button>
                        <button class="media-btn" onclick="sendAction('SEEK_FORWARD')"><i class="fa-solid fa-forward-step"></i></button>
                    </div>

                    <div class="action-row" style="margin-top: 8px;">
                        <button class="action-btn" onclick="sendAction('VOLUME_DOWN')"><i class="fa-solid fa-volume-low"></i> Vol -</button>
                        <button class="action-btn" onclick="sendAction('MUTE')"><i class="fa-solid fa-volume-xmark"></i></button>
                        <button class="action-btn" onclick="sendAction('VOLUME_UP')"><i class="fa-solid fa-volume-high"></i> Vol +</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="log-header">
                <div class="card-title" style="margin: 0;"><i class="fa-solid fa-terminal"></i> Terminal Logs</div>
                <button onclick="clearLog()" style="padding: 6px 12px; font-size: 12px;"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script>
        let ws;
        const logBox = document.getElementById('logBox');
        const statusBadge = document.getElementById('status');
        const isHosted = ['http:', 'https:'].includes(window.location.protocol);
        const defaultHost = isHosted ? window.location.hostname : 'localhost';
        const defaultPort = isHosted
            ? (window.location.port || (window.location.protocol === 'https:' ? '443' : '80'))
            : '8080';
        const socketProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        
        document.getElementById('ipInput').value = defaultHost;
        document.getElementById('portInput').value = defaultPort;

        function log(message, color = "var(--text-main)") {
            const time = new Date().toLocaleTimeString([], { hour12: false });
            const item = document.createElement('div');
            item.className = 'log-item';
            item.style.color = color;
            item.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            logBox.innerHTML = '';
        }

        function getTargetEndpoint() {
            const ip = document.getElementById('ipInput').value.trim() || defaultHost;
            const port = document.getElementById('portInput').value.trim() || defaultPort;
            return { ip, port, url: `${socketProtocol}//${ip}:${port}/control` };
        }

        function updateStatus(state, ip, port) {
            const connCard = document.getElementById('connectionCard');
            const disconnectBtn = `<button onclick="disconnect()" style="margin-left:12px; padding:4px 10px; font-size:12px; font-weight:bold; background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.3); color:#ef4444; border-radius:12px; cursor:pointer;">Disconnect</button>`;
            
            if (state === 'connected') {
                statusBadge.innerHTML = `<i class="fa-solid fa-check-circle"></i> Connected (${ip}:${port})` + disconnectBtn;
                statusBadge.className = "status-badge status-connected";
                if(connCard) connCard.style.display = 'block';
            } else if (state === 'authenticated') {
                statusBadge.innerHTML = `<i class="fa-solid fa-shield-check"></i> Authenticated (${ip}:${port})` + disconnectBtn;
                statusBadge.className = "status-badge status-connected";
                if(connCard) connCard.style.display = 'none';
            } else {
                statusBadge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Disconnected`;
                statusBadge.className = "status-badge";
                if(connCard) connCard.style.display = 'block';
            }
        }

        function connect() {
            if (ws) {
                ws.close();
                ws = null;
            }

            const { ip, port, url } = getTargetEndpoint();
            log(`Attempting connection to ${url}...`, "var(--primary)");
            
            try {
                ws = new WebSocket(url);
            } catch (err) {
                log(`Connection failed: ${err.message}`, "var(--danger)");
                return;
            }
            
            ws.onopen = () => {
                updateStatus('connected', ip, port);
                log(`<b>Connected!</b> Server at <b>${url}</b>`, "var(--success)");
                
                // Auto-attempt auth if token exists
                if(localStorage.getItem("mobplayer_token")) {
                    sendAuthRequest();
                }
            };
            
            ws.onmessage = (event) => {
                const rawData = event.data;
                // Truncate long logs slightly for better readability
                const displayData = rawData.length > 100 ? rawData.substring(0, 100) + '...' : rawData;
                log(`&lt;-- ${displayData}`, "var(--text-muted)");
                
                try {
                    const data = JSON.parse(rawData);
                    if (data.type === "AUTH_SUCCESS") {
                        updateStatus('authenticated', ip, port);
                        localStorage.setItem("mobplayer_token", data.payload);
                        log("<b>Auth Success!</b> Token saved.", "var(--success)");
                    } else if (data.type === "AUTH_FAILED") {
                        log("❌ Auth Failed: " + data.payload, "var(--danger)");
                    } else if (data.type === "PIN_REQUIRED") {
                        log("🔢 PIN required! Enter the 4-digit PIN shown on TV.", "#f59e0b");
                        document.getElementById('pinInput').focus();
                    }
                } catch(e) {}
            };
            
            ws.onclose = () => {
                updateStatus('disconnected');
                log("Connection closed.", "var(--danger)");
            };
            
            ws.onerror = (error) => {
                log(`Connection error to ${url}. Is the TV app open?`, "var(--danger)");
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                updateStatus('disconnected');
                log("Disconnected by user.", "#f59e0b");
            } else {
                log("Already disconnected.", "var(--text-muted)");
            }
        }

        function sendAuthRequest() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return log("Not connected.", "var(--danger)");
            const token = localStorage.getItem("mobplayer_token") || "no-token-yet";
            const msg = JSON.stringify({ type: "AUTH_REQUEST", payload: token });
            ws.send(msg);
            log(`--&gt; Auth Request sent`, "#f59e0b");
        }

        function sendPinSubmit() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return log("Not connected.", "var(--danger)");
            const pin = document.getElementById('pinInput').value.trim();
            if (!pin) return log("Please enter a PIN.", "var(--danger)");
            const msg = JSON.stringify({ type: "PIN_SUBMIT", payload: pin });
            ws.send(msg);
            log(`--&gt; PIN submitted`, "#f59e0b");
            document.getElementById('pinInput').value = ''; // clear pin
        }

        function sendAction(actionName) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return log("Not connected.", "var(--danger)");
            const msg = JSON.stringify({
                type: "COMMAND",
                payload: JSON.stringify({ action: actionName })
            });
            ws.send(msg);
            log(`--&gt; Action: <b>${actionName}</b>`, "var(--primary)");
            
            // Haptic feedback if supported by browser/device
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function sendLoadMedia() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return log("Not connected.", "var(--danger)");
            const url = document.getElementById('mediaUrl').value.trim();
            if (!url) return log("Please provide a video URL.", "var(--danger)");
            const msg = JSON.stringify({
                type: "LOAD_MEDIA",
                payload: url
            });
            ws.send(msg);
            log(`--&gt; Load Media: ${url}`, "#8b5cf6");
        }

        // Add keyboard support for D-Pad
        document.addEventListener('keydown', (e) => {
            // Only trigger if not typing in an input
            if (document.activeElement.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'ArrowUp': sendAction('DPAD_UP'); e.preventDefault(); break;
                case 'ArrowDown': sendAction('DPAD_DOWN'); e.preventDefault(); break;
                case 'ArrowLeft': sendAction('DPAD_LEFT'); e.preventDefault(); break;
                case 'ArrowRight': sendAction('DPAD_RIGHT'); e.preventDefault(); break;
                case 'Enter': sendAction('DPAD_CENTER'); e.preventDefault(); break;
                case 'Escape': sendAction('BACK'); e.preventDefault(); break;
                case ' ': sendAction('PLAY'); e.preventDefault(); break;
            }
        });
        
        // Auto-connect on page load
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('ip')) {
                document.getElementById('ipInput').value = urlParams.get('ip');
            }
            // Add a short delay so UI is fully rendered
            setTimeout(connect, 300);
        };
    </script>
</body>
</html>
